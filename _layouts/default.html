<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }} | Crown of Skies</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="{{ page.page_class | default: 'page-default' }}">
<header class="topnav" style="position:relative;">
  <div class="nav-title">Crown of Skies</div>
  <nav>
    <div style="display:inline-flex;align-items:center;background:#0f1725;border:1px solid #2a3550;border-radius:4px;padding:0 10px;margin-right:8px;">
      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6ea8de" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input
        id="cos-search-input"
        type="text"
        placeholder="Search…"
        autocomplete="off"
        style="background:transparent;border:none;outline:none;color:#d8dce8;font-family:'JetBrains Mono',monospace;font-size:12px;padding:6px 8px;width:160px;"
      />
    </div>
    <a href="{{ '/' | relative_url }}">Home</a>
    <a href="{{ '/lore/' | relative_url }}">Lore</a>
    <a href="{{ '/profiles/' | relative_url }}">Profiles</a>
    <a href="{{ '/magic/' | relative_url }}">Magic</a>
    <a href="{{ '/tech/' | relative_url }}">Tech</a>
    <a href="{{ '/news/' | relative_url }}">News</a>
    <a href="{{ '/files/' | relative_url }}">Files</a>
  </nav>
  <div id="cos-results" style="display:none;position:absolute;top:60px;left:0;right:0;background:#111318;border-bottom:1px solid #2a3550;padding:0.5rem 2rem;z-index:999;max-height:400px;overflow-y:auto;"></div>
</header>
<div class="page">
  <div class="layout">
    <aside class="sidebar">
      <h3>Archive</h3>
      <a href="{{ '/regions/' | relative_url }}">Regions</a>
      <a href="{{ '/lore/' | relative_url }}">Lore</a>
      <a href="{{ '/profiles/' | relative_url }}">Profiles</a>
      <a href="{{ '/magic/' | relative_url }}">Magic</a>
      <a href="{{ '/tech/' | relative_url }}">Tech</a>
      <a href="{{ '/news/' | relative_url }}">News</a>
      <a href="{{ '/files/' | relative_url }}">Files</a>
    </aside>
    <main>
      {{ content }}
    </main>
  </div>
</div>
<footer>
  Crown of Skies Archive · Unauthorized Reality Database
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lunr.js/2.3.9/lunr.min.js"></script>
<script>
(function () {
  var searchIndex = null;
  var allDocs = [];
  var input = document.getElementById('cos-search-input');
  var results = document.getElementById('cos-results');

  fetch('/crownofskies/search.json')
    .then(function(r){ return r.json(); })
    .then(function(data){
      allDocs = data;
      searchIndex = lunr(function(){
        this.ref('url');
        this.field('title', { boost: 10 });
        this.field('content');
        data.forEach(function(doc){ this.add(doc); }, this);
      });
    });

  input.addEventListener('input', function(){
    var query = this.value.trim();
    if (!query || !searchIndex) {
      results.style.display = 'none';
      results.innerHTML = '';
      return;
    }
    var matched = searchIndex.search(query + ' ' + query + '*')
      .map(function(r){ return allDocs.find(function(d){ return d.url === r.ref; }); })
      .filter(Boolean);
    if (!matched.length) {
      results.style.display = 'block';
      results.innerHTML = '<p style="color:#7a8399;margin:8px 0;">No records found.</p>';
      return;
    }
    results.style.display = 'block';
    results.innerHTML = matched.map(function(doc){
      return '<a href="' + doc.url + '" style="display:block;padding:10px 0;border-bottom:1px solid #1e2535;color:#d8dce8;text-decoration:none;">'
        + '<strong style="color:#8fd3ff;display:block;margin-bottom:2px;">' + doc.title + '</strong>'
        + '<span style="font-size:11px;color:#7a8399;font-family:JetBrains Mono,monospace;">' + (doc.date || '') + '</span>'
        + '</a>';
    }).join('');
  });

  document.addEventListener('click', function(e){
    if (!input.contains(e.target) && !results.contains(e.target)) {
      results.style.display = 'none';
    }
  });
})();
</script>
</body>
</html>
